<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${branding.name} + ' — Pago no completado'">Zymos — Pago no completado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Raleway:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style th:attr="nonce=${cspNonce}">
        body { background:#f1f5f9; min-height:100vh; font-family:'Raleway',sans-serif;
            display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
        .card-estado { background:#fff; border-radius:16px; padding:3rem 2.5rem 2.5rem;
            max-width:480px; width:100%; text-align:center; box-shadow:0 8px 40px rgba(0,0,0,.1); }
        .estado-icon { width:72px; height:72px; background:#fee2e2; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            margin:0 auto 1.5rem; font-size:2.2rem; color:#dc2626; }
        .estado-title { font-family:'Cinzel',serif; font-size:1.4rem; color:#1e293b; margin-bottom:.5rem; }
        .estado-sub { color:#64748b; font-size:.95rem; margin-bottom:1rem; }
        .error-detail { background:#fef2f2; border:1px solid #fecaca; border-radius:8px;
            padding:.6rem 1rem; font-size:.85rem; color:#991b1b; margin-bottom:1.5rem; }
        .btn-reintentar { display:inline-block; padding:.7rem 1.5rem; border-radius:10px;
            background:var(--verde-alera,#2563eb); color:#fff; text-decoration:none;
            font-weight:600; transition:opacity .18s; }
        .btn-reintentar:hover { opacity:.9; color:#fff; }
    </style>
</head>
<body>
<div class="card-estado">
    <div class="estado-icon"><i class="bi bi-x-lg"></i></div>
    <div class="estado-title">Pago no completado</div>
    <div class="estado-sub">
        El pago no fue procesado. No se realizó ningún cargo.
    </div>
    <div class="error-detail" th:if="${error}">
        <i class="bi bi-exclamation-circle me-1"></i><span th:text="${error}"></span>
    </div>
    <a th:href="@{/planes}" class="btn-reintentar">
        <i class="bi bi-arrow-counterclockwise me-1"></i>Intentar de nuevo
    </a>
</div>
</body>
</html>
