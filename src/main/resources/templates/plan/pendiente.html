<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${branding.name} + ' — Pago pendiente'">Zymos — Pago pendiente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Raleway:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style th:attr="nonce=${cspNonce}">
        body { background:#f1f5f9; min-height:100vh; font-family:'Raleway',sans-serif;
            display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
        .card-estado { background:#fff; border-radius:16px; padding:3rem 2.5rem 2.5rem;
            max-width:480px; width:100%; text-align:center; box-shadow:0 8px 40px rgba(0,0,0,.1); }
        .estado-icon { width:72px; height:72px; background:#fef9c3; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            margin:0 auto 1.5rem; font-size:2.2rem; color:#ca8a04; }
        .estado-title { font-family:'Cinzel',serif; font-size:1.4rem; color:#1e293b; margin-bottom:.5rem; }
        .estado-sub { color:#64748b; font-size:.95rem; margin-bottom:1.75rem; }
        .btn-volver { display:inline-block; padding:.7rem 1.5rem; border-radius:10px;
            background:var(--verde-alera,#2563eb); color:#fff; text-decoration:none;
            font-weight:600; transition:opacity .18s; }
        .btn-volver:hover { opacity:.9; color:#fff; }
    </style>
</head>
<body>
<div class="card-estado">
    <div class="estado-icon"><i class="bi bi-clock-history"></i></div>
    <div class="estado-title">Pago pendiente</div>
    <div class="estado-sub">
        Tu pago está siendo procesado. Esto puede tardar unos minutos.<br>
        Cuando se confirme, te enviaremos las credenciales de acceso por email.
    </div>
    <a th:href="@{/planes}" class="btn-volver">
        <i class="bi bi-arrow-left me-1"></i>Volver a planes
    </a>
</div>
</body>
</html>
