<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando demo...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; font-family: 'Segoe UI', Arial, sans-serif;
        }
        .logo {
            font-size: 1.5rem; font-weight: 700; color: #c9a028;
            margin-bottom: 2rem; letter-spacing: .03em;
        }
        .spinner {
            width: 48px; height: 48px; border: 4px solid rgba(201,160,40,.2);
            border-top-color: #c9a028; border-radius: 50%;
            animation: spin .8s linear infinite; margin-bottom: 1.25rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .msg { color: #94a3b8; font-size: .95rem; }
        .msg strong { color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="logo">⬡ Zymos</div>
    <div class="spinner"></div>
    <p class="msg">Preparando el <strong>entorno de demo</strong>...</p>

    <form id="f" action="/login" method="post" style="display:none">
        <input type="hidden" name="username" value="demo">
        <input type="hidden" name="password" value="demo">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    </form>
    <script th:attr="nonce=${cspNonce}">document.addEventListener('DOMContentLoaded', function () { document.getElementById('f').submit(); });</script>
</body>
</html>
