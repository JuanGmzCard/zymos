<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${branding.name} + ' - ' + (${webhookFormDto.id != null} ? #{webhook.form.title.editar} : #{webhook.form.title.nuevo})">Zymos - Webhook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style th:attr="nonce=${cspNonce}">
        .evento-check { display:flex; align-items:center; gap:.5rem; padding:.5rem .75rem;
                        border:1px solid #e2e8f0; border-radius:8px; cursor:pointer; transition:.15s; }
        .evento-check:hover { background:#f8fafc; }
        .evento-check input[type=checkbox] { width:1.1rem; height:1.1rem; cursor:pointer; }
        .evento-check label { font-size:.85rem; cursor:pointer; margin:0; }
        html.dark-mode .evento-check { border-color: var(--dm-border); }
        html.dark-mode .evento-check:hover { background: var(--dm-hover); }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="zymos-main">
<div class="container-fluid px-4">
    <div class="page-header">
        <h1 class="mb-0" th:text="${webhookFormDto.id != null} ? #{webhook.form.title.editar} : #{webhook.form.title.nuevo}">Webhook</h1>
    </div>

    <div class="row justify-content-center mt-3">
        <div class="col-lg-7">
            <div class="table-card">
                <div class="sb p-4">
                    <form th:action="${webhookFormDto.id != null} ? @{/admin/webhooks/actualizar/{id}(id=${webhookFormDto.id})} : @{/admin/webhooks/guardar}"
                          method="post" th:object="${webhookFormDto}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <!-- Nombre -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold" style="font-size:.85rem"
                                   th:text="#{webhook.form.nombre}">Nombre</label>
                            <input type="text" id="nombre" th:field="*{nombre}"
                                   class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? ' is-invalid' : ''"
                                   th:placeholder="#{webhook.form.nombre.placeholder}">
                            <div class="invalid-feedback" th:errors="*{nombre}"></div>
                        </div>

                        <!-- URL -->
                        <div class="mb-3">
                            <label for="url" class="form-label fw-semibold" style="font-size:.85rem"
                                   th:text="#{webhook.form.url}">URL destino</label>
                            <input type="url" id="url" th:field="*{url}"
                                   class="form-control" th:classappend="${#fields.hasErrors('url')} ? ' is-invalid' : ''"
                                   th:placeholder="#{webhook.form.url.placeholder}">
                            <div class="invalid-feedback" th:errors="*{url}"></div>
                        </div>

                        <!-- Secret -->
                        <div class="mb-3">
                            <label for="secret" class="form-label fw-semibold" style="font-size:.85rem"
                                   th:text="#{webhook.form.secret}">Secreto</label>
                            <div class="input-group">
                                <input type="text" id="secret" th:field="*{secret}"
                                       class="form-control font-monospace"
                                       th:placeholder="${secretGenerado ?: ''}">
                                <button type="button" class="btn btn-outline-secondary btn-sm"
                                        id="btnGenSecret" th:title="#{webhook.form.secret.generar}">
                                    <i class="bi bi-arrow-clockwise"></i>
                                </button>
                            </div>
                            <small class="text-muted" style="font-size:.78rem"
                                   th:text="#{webhook.form.secret.hint}">Deja vacío para generar automáticamente</small>
                        </div>

                        <!-- Eventos -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="font-size:.85rem"
                                   th:text="#{webhook.form.eventos}">Eventos suscritos</label>
                            <div th:if="${#fields.hasErrors('eventosList')}" class="alert alert-warning py-1 px-2 mb-2" style="font-size:.8rem">
                                <span th:errors="*{eventosList}"></span>
                            </div>
                            <div class="d-flex flex-column gap-2">
                                <div th:each="ev : ${eventosDisponibles}" class="evento-check">
                                    <input type="checkbox" th:id="'ev_' + ${ev}"
                                           name="eventosList" th:value="${ev}"
                                           th:checked="${webhookFormDto.eventosList != null and #lists.contains(webhookFormDto.eventosList, ev)}">
                                    <label th:for="'ev_' + ${ev}"
                                           th:text="${#messages.msgOrNull('webhook.evento.' + ev) ?: ev}">evento</label>
                                </div>
                            </div>
                        </div>

                        <!-- Activo -->
                        <div class="mb-4 form-check">
                            <input type="checkbox" id="activo" th:field="*{activo}" class="form-check-input">
                            <label for="activo" class="form-check-label" style="font-size:.85rem"
                                   th:text="#{webhook.form.activo}">Activo</label>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm" th:text="#{action.save}">Guardar</button>
                            <a th:href="@{/admin/webhooks}" class="btn btn-outline-secondary btn-sm"
                               th:text="#{action.cancel}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</main>
<script th:attr="nonce=${cspNonce}">
document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('btnGenSecret');
    var inp = document.getElementById('secret');
    if (btn && inp) {
        btn.addEventListener('click', function () {
            var arr = new Uint8Array(20);
            crypto.getRandomValues(arr);
            inp.value = Array.from(arr).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
        });
    }
});
</script>
</body>
</html>
