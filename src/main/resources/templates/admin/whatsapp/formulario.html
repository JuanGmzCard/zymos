<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${branding.name} + ' - ' + (${form.id != null} ? #{wa.form.titulo.editar} : #{wa.form.titulo.nuevo})">Alera - WhatsApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style th:attr="nonce=${cspNonce}">
        .cat-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            margin-top: 1rem;
        }
        .cat-label:first-child { margin-top: 0; }
        .check-tipo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .check-tipo:hover { background: #f8fafc; }
        .check-tipo input[type=checkbox] { width: 1rem; height: 1rem; cursor: pointer; }

        html.dark-mode .check-tipo:hover { background: var(--dm-hover); }
        html.dark-mode .cat-label { color: var(--dm-text-muted); }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-header">
    <div class="container-fluid px-4">
        <h1 th:text="${form.id != null} ? #{wa.form.titulo.editar} : #{wa.form.titulo.nuevo}">Contacto WhatsApp</h1>
        <span class="subtitle">
            <a href="/admin/whatsapp" class="text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>Volver a contactos
            </a>
        </span>
    </div>
</div>

<div class="container-fluid px-4 pb-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="filter-card">
                <form th:action="${form.id != null} ? @{/admin/whatsapp/actualizar/{id}(id=${form.id})} : @{/admin/whatsapp/guardar}"
                      th:object="${form}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- Nombre -->
                    <div class="mb-3">
                        <label class="form-label fw-600" th:text="#{wa.nombre}">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}"
                               th:classappend="${#fields.hasErrors('nombre')} ? ' is-invalid' : ''"
                               placeholder="Ej: María González — Compras">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
                             th:errors="*{nombre}">Error</div>
                    </div>

                    <!-- Teléfono -->
                    <div class="mb-3">
                        <label class="form-label fw-600" th:text="#{wa.telefono}">Teléfono</label>
                        <input type="text" class="form-control" th:field="*{telefono}"
                               th:classappend="${#fields.hasErrors('telefono')} ? ' is-invalid' : ''"
                               placeholder="+573001234567">
                        <div class="form-text" th:text="#{wa.telefono.hint}">Formato internacional con código de país</div>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}"
                             th:errors="*{telefono}">Error</div>
                    </div>

                    <!-- Activo -->
                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{activo}" id="activoCheck">
                            <label class="form-check-label" for="activoCheck" th:text="#{wa.activo}">Activo</label>
                        </div>
                    </div>

                    <!-- Suscripciones agrupadas por categoría -->
                    <div class="mb-4">
                        <label class="form-label fw-600" th:text="#{wa.suscripciones}">Alertas suscritas</label>
                        <p class="text-muted mb-3" style="font-size:0.85rem" th:text="#{wa.form.selecciona}">Selecciona las alertas que recibirá este número:</p>

                        <th:block th:with="categorias=${ {'Inventario','Producción','Equipos','BPM','Tareas','Admin','Reportes'} }">
                            <th:block th:each="cat : ${categorias}">
                                <div class="cat-label" th:text="${cat}">Categoría</div>
                                <th:block th:each="tipo : ${tiposAlerta}">
                                    <label th:if="${tipo.categoria == cat}" class="check-tipo">
                                        <input type="checkbox"
                                               th:field="*{tiposSuscritos}"
                                               th:value="${tipo.name()}">
                                        <span th:text="${tipo.displayName}">Tipo</span>
                                    </label>
                                </th:block>
                            </th:block>
                        </th:block>
                    </div>

                    <!-- Botones -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-sm">
                            <i class="bi bi-check-lg me-1"></i>Guardar
                        </button>
                        <a href="/admin/whatsapp" class="btn btn-outline-secondary btn-sm">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
