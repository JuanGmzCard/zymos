<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf"        th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${branding.name} + ' - ' + #{chat.title}">Zymos - Asistente IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style th:attr="nonce=${cspNonce}">
        .chat-wrapper {
            display: flex; flex-direction: column; height: calc(100vh - 112px);
            max-width: 820px; margin: 0 auto;
        }
        .chat-header {
            padding: 1.25rem 0 0.75rem; flex-shrink: 0;
        }
        .chat-header h1 { font-size: 1.4rem; font-weight: 700; color: #1e293b; margin-bottom: 0.15rem; }
        .chat-header .subtitle { font-size: 0.85rem; color: #94a3b8; }

        .chat-messages {
            flex: 1; overflow-y: auto; padding: 1rem 0;
            display: flex; flex-direction: column; gap: 0.75rem;
        }
        .chat-bubble { display: flex; gap: 0.65rem; align-items: flex-start; }
        .chat-bubble.user { flex-direction: row-reverse; }

        .chat-avatar {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; font-weight: 600;
        }
        .chat-avatar.bot  { background: linear-gradient(135deg, var(--verde-alera, #364318), var(--dorado, #c9a028)); color: #fff; }
        .chat-avatar.user { background: #e2e8f0; color: #475569; }

        .chat-text {
            max-width: 75%; padding: 0.65rem 1rem; border-radius: 12px;
            font-size: 0.9rem; line-height: 1.55; word-wrap: break-word;
        }
        .chat-bubble.bot  .chat-text { background: #fff; border: 1px solid #e2e8f0; color: #1e293b; border-top-left-radius: 4px; }
        .chat-bubble.user .chat-text { background: var(--verde-alera, #364318); color: #fff; border-top-right-radius: 4px; }

        .chat-typing {
            display: flex; gap: 4px; align-items: center; padding: 0.5rem 0.75rem;
        }
        .chat-typing span {
            width: 7px; height: 7px; border-radius: 50%; background: #94a3b8;
            animation: bounce 1.2s infinite;
        }
        .chat-typing span:nth-child(2) { animation-delay: 0.2s; }
        .chat-typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30%            { transform: translateY(-6px); }
        }

        .chat-input-area {
            padding: 0.75rem 0 1rem; flex-shrink: 0;
            border-top: 1px solid #e2e8f0;
        }
        .chat-input-row {
            display: flex; gap: 0.5rem; align-items: flex-end;
        }
        #chatInput {
            flex: 1; border-radius: 24px; border: 1px solid #e2e8f0;
            padding: 0.65rem 1.1rem; font-size: 0.9rem; outline: none;
            resize: none; max-height: 120px; overflow-y: auto;
            transition: border-color .2s;
        }
        #chatInput:focus { border-color: var(--verde-alera, #364318); box-shadow: none; }
        #chatSend {
            border-radius: 50%; width: 40px; height: 40px; padding: 0;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; border: none;
            background: var(--verde-alera, #364318); color: #fff;
            transition: opacity .2s;
        }
        #chatSend:disabled { opacity: 0.5; cursor: not-allowed; }

        .chat-suggestions {
            display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem;
        }
        .chat-suggestion {
            font-size: 0.78rem; padding: 0.3rem 0.75rem; border-radius: 20px;
            border: 1px solid #e2e8f0; background: #fff; color: #475569;
            cursor: pointer; transition: background .15s, border-color .15s;
        }
        .chat-suggestion:hover { background: #f8fafc; border-color: var(--verde-alera, #364318); color: #1e293b; }

        .mock-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 10px;
            background: #fef9c3; color: #a16207; margin-top: 0.3rem;
        }

        html.dark-mode .chat-header h1 { color: var(--dm-text); }
        html.dark-mode .chat-header .subtitle { color: var(--dm-text-muted); }
        html.dark-mode .chat-bubble.bot .chat-text { background: var(--dm-card); border-color: var(--dm-border-light); color: var(--dm-text); }
        html.dark-mode .chat-input-area { border-color: var(--dm-border-light); }
        html.dark-mode #chatInput { background: var(--dm-card); border-color: var(--dm-border-light); color: var(--dm-text); }
        html.dark-mode .chat-suggestion { background: var(--dm-card); border-color: var(--dm-border-light); color: var(--dm-text-muted); }
        html.dark-mode .chat-suggestion:hover { background: var(--dm-hover); }
        html.dark-mode .chat-avatar.user { background: var(--dm-input); color: var(--dm-text-muted); }

        .chat-mock-banner {
            background: #fef9c3; color: #854d0e; border: 1px solid #fde68a;
            border-radius: 8px; padding: 0.5rem 0.9rem;
            font-size: 0.8rem; display: flex; align-items: center; gap: 0.4rem;
            margin-bottom: 0.5rem; flex-shrink: 0;
        }
        html.dark-mode .chat-mock-banner { background: rgba(234,179,8,0.1); border-color: rgba(234,179,8,0.3); color: #fbbf24; }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-4">
    <div class="chat-wrapper">

        <!-- Header -->
        <div class="chat-header">
            <h1><i class="bi bi-chat-dots-fill me-2" style="color: var(--verde-alera, #364318);"></i><span th:text="#{chat.title}">Asistente IA</span></h1>
            <div class="subtitle">
                <span th:text="#{chat.subtitle}">Pregunta sobre tus lotes, inventario y operaciones</span>
                <span th:if="${!iaConfigurada}" class="ms-2 mock-badge">
                    <i class="bi bi-flask"></i><span th:text="#{ia.mock.badge}">Modo de prueba</span>
                </span>
            </div>
        </div>

        <!-- Banner modo demo -->
        <div th:if="${!iaConfigurada}" class="chat-mock-banner">
            <i class="bi bi-info-circle-fill"></i>
            <span th:text="#{chat.mock.banner}">Modo demostración — las respuestas son predefinidas. Configura ANTHROPIC_API_KEY para activar la IA real.</span>
        </div>

        <!-- Mensajes -->
        <div class="chat-messages" id="chatMessages">
            <!-- Welcome -->
            <div class="chat-bubble bot">
                <div class="chat-avatar bot"><i class="bi bi-stars"></i></div>
                <div>
                    <div class="chat-text" th:text="#{chat.welcome(${branding.name})}">¡Hola! Soy el asistente de Zymos.</div>
                </div>
            </div>
        </div>

        <!-- Input area -->
        <div class="chat-input-area">
            <!-- Sugerencias contextuales -->
            <div class="chat-suggestions" id="chatSuggestions">
                <button class="chat-suggestion"
                        th:each="sug : ${sugerencias}"
                        th:text="${sug}">¿Cuántos lotes activos tengo?</button>
            </div>
            <div class="chat-input-row">
                <textarea id="chatInput" rows="1"
                          th:placeholder="#{chat.input.placeholder}">
                </textarea>
                <button id="chatSend" title="Enviar">
                    <i class="bi bi-send-fill" style="font-size:0.9rem;"></i>
                </button>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" th:attr="nonce=${cspNonce}"></script>
<script th:attr="nonce=${cspNonce}">
(function() {
    var historial = [];
    var enviando  = false;
    var csrf  = document.querySelector('meta[name="_csrf"]');
    var hdr   = document.querySelector('meta[name="_csrf_header"]');

    var messagesEl    = document.getElementById('chatMessages');
    var inputEl       = document.getElementById('chatInput');
    var sendBtn       = document.getElementById('chatSend');
    var suggestionsEl = document.getElementById('chatSuggestions');

    function scrollBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(role, contenido, modoMock) {
        var wrap = document.createElement('div');
        wrap.className = 'chat-bubble ' + role;

        var avatar = document.createElement('div');
        avatar.className = 'chat-avatar ' + (role === 'bot' ? 'bot' : 'user');
        avatar.innerHTML = role === 'bot'
            ? '<i class="bi bi-stars"></i>'
            : '<i class="bi bi-person-fill"></i>';

        var inner = document.createElement('div');
        var text  = document.createElement('div');
        text.className = 'chat-text';
        text.textContent = contenido;
        inner.appendChild(text);

        if (modoMock && role === 'bot') {
            var badge = document.createElement('div');
            badge.className = 'mock-badge';
            badge.innerHTML = '<i class="bi bi-flask"></i> Modo de prueba';
            inner.appendChild(badge);
        }

        wrap.appendChild(avatar);
        wrap.appendChild(inner);
        messagesEl.appendChild(wrap);
        scrollBottom();
        return wrap;
    }

    function addTyping() {
        var wrap = document.createElement('div');
        wrap.className = 'chat-bubble bot';
        wrap.id = 'chatTyping';

        var avatar = document.createElement('div');
        avatar.className = 'chat-avatar bot';
        avatar.innerHTML = '<i class="bi bi-stars"></i>';

        var text = document.createElement('div');
        text.className = 'chat-text';
        text.innerHTML = '<div class="chat-typing"><span></span><span></span><span></span></div>';

        wrap.appendChild(avatar);
        wrap.appendChild(text);
        messagesEl.appendChild(wrap);
        scrollBottom();
        return wrap;
    }

    function removeTyping() {
        var el = document.getElementById('chatTyping');
        if (el) el.remove();
    }

    function enviar(texto) {
        if (enviando || !texto.trim()) return;
        texto = texto.trim();

        // Ocultar sugerencias tras el primer mensaje
        suggestionsEl.style.display = 'none';

        // Agregar mensaje del usuario
        addMessage('user', texto, false);
        historial.push({ role: 'user', contenido: texto });

        inputEl.value = '';
        inputEl.style.height = 'auto';
        enviando = true;
        sendBtn.disabled = true;
        addTyping();

        var headers = { 'Content-Type': 'application/json' };
        if (csrf && hdr) headers[hdr.content] = csrf.content;

        fetch('/chat/mensaje', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({ pregunta: texto, historial: historial.slice(-10) })
        })
        .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        })
        .then(function(data) {
            removeTyping();
            addMessage('bot', data.contenido, data.modoMock);
            historial.push({ role: 'assistant', contenido: data.contenido });
        })
        .catch(function(e) {
            removeTyping();
            addMessage('bot', 'Error al conectar: ' + e.message, false);
        })
        .finally(function() {
            enviando = false;
            sendBtn.disabled = false;
            inputEl.focus();
        });
    }

    // Auto-resize textarea
    inputEl.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    // Enter = enviar, Shift+Enter = nueva línea
    inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            enviar(this.value);
        }
    });

    sendBtn.addEventListener('click', function() {
        enviar(inputEl.value);
    });

    // Sugerencias
    document.querySelectorAll('.chat-suggestion').forEach(function(btn) {
        btn.addEventListener('click', function() {
            enviar(this.textContent.trim());
        });
    });

    scrollBottom();
    inputEl.focus();
})();
</script>
</body>
</html>
