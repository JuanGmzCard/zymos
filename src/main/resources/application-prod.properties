# Perfil de producción — activar con SPRING_PROFILES_ACTIVE=prod
# Sobreescribe application.properties: elimina el fallback de credenciales.
# Si DB_PASSWORD no está definida, la app falla al iniciar con error claro.

# ── Datasource (rol app — solo DML: SELECT/INSERT/UPDATE/DELETE) ──
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── Flyway usa rol separado con permisos DDL ──────────────────────
# Crear rol zymos_flyway en PostgreSQL con: db_security.sql
spring.flyway.url=${DB_URL}
spring.flyway.user=${FLYWAY_USERNAME:${DB_USERNAME}}
spring.flyway.password=${FLYWAY_PASSWORD:${DB_PASSWORD}}

# ── HikariCP (pool mayor en prod) ─────────────────────────────────
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
# Validar conexión antes de entregarla del pool (detecta caídas de red)
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=60000

# JWT — el secreto debe definirse siempre en producción
app.jwt.secret=${JWT_SECRET}

# ── Sesión segura ─────────────────────────────────────────────────
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Strict

# ── Thymeleaf ─────────────────────────────────────────────────────
spring.thymeleaf.cache=true

# ── Sentry ────────────────────────────────────────────────────────
sentry.environment=prod